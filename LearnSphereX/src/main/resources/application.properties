spring.application.name=LearnSphereX
server.port=8082

# MySQL - override with environment variables when needed
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learnspherex_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:MyLearnSphereXSecretKey_2026_12345678901234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mail (optional)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Local file storage for uploaded course materials
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
