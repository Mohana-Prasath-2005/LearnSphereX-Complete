<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Assignment Detail')}"></head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(active='assignments')}"></div>

    <div class="main-area">
        <div th:replace="~{fragments/navbar :: navbar(heading=${assignment.title}, eyebrow='MODULE MANAGEMENT')}"></div>

        <main class="page-content">
            <a class="back-link" th:href="@{/assignments}">← Back to Assignments</a>
            <!-- Assignment summary -->
            <section class="hero">
                <div>
                    <span class="badge" th:text="${assignment.difficulty}">MEDIUM</span>
                    <h2 th:text="${assignment.title}">Title</h2>
                    <p th:text="${assignment.description}">Description</p>
                    <p>
                        <strong>Course:</strong> <span th:text="${assignment.course != null ? assignment.course.courseName : 'N/A'}"></span> &nbsp;|&nbsp;
                        <strong>Deadline:</strong> <span th:text="${assignment.deadline}"></span> &nbsp;|&nbsp;
                        <strong>Max Marks:</strong> <span th:text="${assignment.maxMarks}"></span> &nbsp;|&nbsp;
                        <strong>Status:</strong> <span class="pill" th:text="${assignment.status}"></span>
                    </p>
                </div>
            </section>

            <!-- Submit form (simulates a student submitting) -->
            <div class="panel form-panel">
                <div class="panel-head">
                    <div>
                        <span class="eyebrow">STUDENT ACTION</span>
                        <h3>Submit This Assignment</h3>
                    </div>
                </div>
                <form th:action="@{/assignments/{id}/submit(id=${assignment.id})}" method="post">
                    <div class="form-grid">
                        <div class="field">
                            <label>Student ID <span class="required">*</span></label>
                            <input class="input" type="number" name="studentId" placeholder="e.g. 101" required>
                        </div>
                        <div class="field">
                            <label>Submission URL <span class="required">*</span></label>
                            <input class="input" type="text" name="submissionUrl" placeholder="e.g. https://github.com/student/repo" required>
                        </div>
                        <div class="field full">
                            <label>Comments</label>
                            <textarea class="textarea" name="comments" placeholder="Any notes for the trainer"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn primary">Submit Assignment</button>
                    </div>
                </form>
            </div>

            <!-- Submissions list + evaluate -->
            <div class="panel">
                <div class="panel-head">
                    <div>
                        <span class="eyebrow">DATABASE RECORDS</span>
                        <h3>Submissions</h3>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(submissions)}" class="empty">
                    No submissions yet.
                </div>

                <div th:each="submission : ${submissions}" style="padding:18px 22px; border-bottom:1px solid var(--line)">
                    <strong th:text="'Student #' + ${submission.studentId} + ' — Version ' + ${submission.version}">Student</strong>
                    <div class="block">
                        <a class="code-link" th:href="${submission.submissionUrl}" target="_blank" th:text="${submission.submissionUrl}"></a>
                    </div>
                    <p th:if="${submission.comments}" th:text="${submission.comments}" style="margin:8px 0"></p>
                    <p style="margin:8px 0">
                        <span class="pill" th:text="${submission.status}">SUBMITTED</span>
                        &nbsp;<span th:if="${submission.marks != null}" th:text="'Marks: ' + ${submission.marks} + ' / ' + ${assignment.maxMarks}"></span>
                    </p>
                    <p th:if="${submission.feedback}" style="margin:8px 0">
                        <strong>Feedback:</strong> <span th:text="${submission.feedback}"></span>
                    </p>

                    <!-- Evaluate form -->
                    <form th:action="@{/submissions/{id}/evaluate(id=${submission.id})}" method="post"
                          style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
                        <input type="hidden" name="assignmentId" th:value="${assignment.id}">
                        <input class="input" type="number" name="marks" min="0" th:max="${assignment.maxMarks}" placeholder="Marks" required style="width:100px;">
                        <input class="input" type="text" name="feedback" placeholder="Feedback" style="flex:1; min-width:150px;">
                        <button type="submit" class="btn secondary small">Evaluate</button>
                    </form>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

</body>
</html>
