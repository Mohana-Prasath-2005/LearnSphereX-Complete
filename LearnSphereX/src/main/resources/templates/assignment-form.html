<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${editing} ? 'Edit Assignment' : 'Add Assignment')}"></head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(active='assignments')}"></div>

    <div class="main-area">
        <div th:replace="~{fragments/navbar :: navbar(heading=${editing} ? 'Edit Assignment' : 'Add New Assignment', eyebrow='MODULE MANAGEMENT')}"></div>

        <main class="page-content">
            <a class="back-link" th:href="@{/assignments}">← Back to Assignments</a>
            <section class="form-panel">
                <div class="eyebrow">MODULE MANAGEMENT</div>
                <h2 th:text="${editing} ? 'Edit Assignment' : 'Create Assignment'">Create Assignment</h2>
                <div class="alert error" th:if="${error}" th:text="${error}"></div>

                <form th:action="${editing} ? @{/assignments/{id}/edit(id=${assignment.id})} : @{/assignments}" method="post">
                    <div class="form-grid">
                        <div class="field full">
                            <label>Title <span class="required">*</span></label>
                            <input class="input" type="text" name="title" th:value="${assignment.title}" placeholder="e.g. Spring Data JPA CRUD" required>
                        </div>
                        <div class="field full">
                            <label>Description</label>
                            <textarea class="textarea" name="description" th:text="${assignment.description}" placeholder="What should the student build"></textarea>
                        </div>
                        <div class="field">
                            <label>Course <span class="required">*</span></label>
                            <select class="select" name="courseId" required>
                                <option value="">-- Select Course --</option>
                                <option th:each="c : ${courses}"
                                        th:value="${c.id}"
                                        th:text="${c.courseCode} + ' - ' + ${c.courseName}"
                                        th:selected="${assignment.course != null and assignment.course.id == c.id}"></option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Difficulty</label>
                            <select class="select" name="difficulty">
                                <option value="EASY" th:selected="${assignment.difficulty == 'EASY'}">EASY</option>
                                <option value="INTERMEDIATE" th:selected="${assignment.difficulty == 'INTERMEDIATE'}">INTERMEDIATE</option>
                                <option value="HARD" th:selected="${assignment.difficulty == 'HARD'}">HARD</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Deadline <span class="required">*</span></label>
                            <input class="input" type="datetime-local" name="deadline" th:value="${assignment.deadline}" required>
                        </div>
                        <div class="field">
                            <label>Max Marks <span class="required">*</span></label>
                            <input class="input" type="number" min="1" name="maxMarks" th:value="${assignment.maxMarks}" required>
                        </div>
                        <div class="field">
                            <label>Status</label>
                            <select class="select" name="status">
                                <option value="ACTIVE" th:selected="${assignment.status == 'ACTIVE'}">ACTIVE</option>
                                <option value="CLOSED" th:selected="${assignment.status == 'CLOSED'}">CLOSED</option>
                                <option value="DRAFT" th:selected="${assignment.status == 'DRAFT'}">DRAFT</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a class="btn secondary" th:href="@{/assignments}">Cancel</a>
                        <button type="submit" class="btn primary" th:text="${editing} ? 'Save Changes' : 'Create Assignment'">Create Assignment</button>
                    </div>
                </form>
            </section>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

</body>
</html>
