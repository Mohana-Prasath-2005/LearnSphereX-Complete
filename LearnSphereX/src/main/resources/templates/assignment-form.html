<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LearnSphereX - Assignment Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">SS</div>
            <div>
                <strong>LearnSphereX</strong>
                <span>Enterprise Portal</span>
            </div>
        </div>
        <div class="nav-label">NAVIGATION</div>
        <nav class="nav">
            <a class="nav-item" th:href="@{/courses}">📚 Courses</a>
            <a class="nav-item" th:href="@{/assignments}">📝 Assignments</a>
        </nav>
        <div class="sidebar-footer">
            <div class="mini-avatar">AD</div>
            <div>
                <strong>Admin User</strong>
                <span>admin@learnspherex.com</span>
            </div>
        </div>
    </aside>

    <div class="main-area">
        <header class="topbar">
            <div>
                <span class="eyebrow">MODULE MANAGEMENT</span>
                <h1 th:text="${editing} ? 'Edit Assignment' : 'Add New Assignment'">Add New Assignment</h1>
            </div>
            <div class="topbar-right">
                <span class="status-dot"></span> System Online
            </div>
        </header>

        <main class="page-content">
            <div class="panel form-panel">
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

                <form th:action="${editing} ? @{/assignments/{id}/edit(id=${assignment.id})} : @{/assignments}" method="post">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" name="title" th:value="${assignment.title}" placeholder="e.g. Spring Data JPA CRUD" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" th:text="${assignment.description}" placeholder="What should the student build"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Course</label>
                        <select name="courseId" required>
                            <option value="">-- Select Course --</option>
                            <option th:each="c : ${courses}"
                                    th:value="${c.id}"
                                    th:text="${c.courseCode} + ' - ' + ${c.courseName}"
                                    th:selected="${assignment.course != null and assignment.course.id == c.id}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Difficulty</label>
                        <select name="difficulty">
                            <option value="EASY" th:selected="${assignment.difficulty == 'EASY'}">EASY</option>
                            <option value="INTERMEDIATE" th:selected="${assignment.difficulty == 'INTERMEDIATE'}">INTERMEDIATE</option>
                            <option value="HARD" th:selected="${assignment.difficulty == 'HARD'}">HARD</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Deadline</label>
                        <input type="datetime-local" name="deadline" th:value="${assignment.deadline}" required>
                    </div>
                    <div class="form-group">
                        <label>Max Marks</label>
                        <input type="number" min="1" name="maxMarks" th:value="${assignment.maxMarks}" required>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="status">
                            <option value="ACTIVE" th:selected="${assignment.status == 'ACTIVE'}">ACTIVE</option>
                            <option value="CLOSED" th:selected="${assignment.status == 'CLOSED'}">CLOSED</option>
                            <option value="DRAFT" th:selected="${assignment.status == 'DRAFT'}">DRAFT</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" th:text="${editing} ? 'Save Changes' : 'Create Assignment'">Create Assignment</button>
                        <a class="btn btn-secondary" th:href="@{/assignments}">Cancel</a>
                    </div>
                </form>
            </div>
        </main>

        <footer class="footer">
            <span>&copy; 2026 LearnSphereX Enterprise. All rights reserved.</span>
        </footer>
    </div>
</div>

</body>
</html>
