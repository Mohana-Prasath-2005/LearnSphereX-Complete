<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Attendance Details')}"></head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(active='attendance')}"></div>

    <div class="main-area">
        <div th:replace="~{fragments/navbar :: navbar(heading='Attendance Details', eyebrow='BATCH MANAGEMENT')}"></div>

        <main class="page-content">
            <a class="back-link" th:href="@{/attendance}">← Back to Attendance</a>

            <div class="detail-card" style="max-width:600px">
                <h3>Record #<span th:text="${attendance.id}"></span></h3>
                <div class="detail-grid">
                    <div class="detail-item"><span>Batch ID</span><strong th:text="${attendance.batchId}"></strong></div>
                    <div class="detail-item"><span>Student ID</span><strong th:text="${attendance.studentId}"></strong></div>
                    <div class="detail-item"><span>Date</span><strong th:text="${attendance.attendanceDate}"></strong></div>
                    <div class="detail-item">
                        <span>Status</span>
                        <strong>
                            <span class="pill"
                                  th:classappend="${attendance.status.name() == 'ABSENT'} ? ' inactive' : (${attendance.status.name() == 'LATE'} ? ' warning' : '')"
                                  th:text="${attendance.status}"></span>
                        </strong>
                    </div>
                </div>
                <div class="form-actions">
                    <a class="btn secondary" th:href="@{/attendance}">Back</a>
                    <a class="btn primary" th:href="@{/attendance/{id}/edit(id=${attendance.id})}">Edit</a>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

</body>
</html>
