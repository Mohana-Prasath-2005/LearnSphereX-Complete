<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Attendance Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f7f7f7;
        }

        .container {
            width: 450px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #333;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        .back {
            display: block;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Attendance</h1>

    <form
        th:action="${attendance.id == null}
            ? @{/attendance}
            : @{/attendance/{id}(id=${attendance.id})}"
        method="post">

        <label for="batchId">
            Batch ID
        </label>

        <input
            type="number"
            id="batchId"
            name="batchId"
            th:value="${attendance.batchId}"
            required>


        <label for="studentId">
            Student ID
        </label>

        <input
            type="number"
            id="studentId"
            name="studentId"
            th:value="${attendance.studentId}"
            required>


        <label for="attendanceDate">
            Attendance Date
        </label>

        <input
            type="date"
            id="attendanceDate"
            name="attendanceDate"
            th:value="${attendance.attendanceDate}"
            required>


        <label for="status">
            Attendance Status
        </label>

        <select
            id="status"
            name="status"
            required>

            <option value="">
                Select Status
            </option>

            <option
                value="PRESENT"
                th:selected="${attendance.status != null
                    and attendance.status.name() == 'PRESENT'}">
                PRESENT
            </option>

            <option
                value="ABSENT"
                th:selected="${attendance.status != null
                    and attendance.status.name() == 'ABSENT'}">
                ABSENT
            </option>

            <option
                value="LATE"
                th:selected="${attendance.status != null
                    and attendance.status.name() == 'LATE'}">
                LATE
            </option>

        </select>

        <button type="submit">
            Save Attendance
        </button>

    </form>

    <a href="/attendance" class="back">
        Back to Attendance
    </a>

</div>

</body>

</html>
