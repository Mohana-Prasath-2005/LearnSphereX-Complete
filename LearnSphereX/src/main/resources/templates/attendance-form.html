<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${attendance.id == null} ? 'Mark Attendance' : 'Edit Attendance')}"></head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(active='attendance')}"></div>

    <div class="main-area">
        <div th:replace="~{fragments/navbar :: navbar(heading=${attendance.id == null} ? 'Mark Attendance' : 'Edit Attendance', eyebrow='BATCH MANAGEMENT')}"></div>

        <main class="page-content">
            <a class="back-link" th:href="@{/attendance}">← Back to Attendance</a>

            <section class="form-panel">
                <h2 th:text="${attendance.id == null} ? 'Mark Attendance' : 'Edit Attendance'">Mark Attendance</h2>

                <form th:action="${attendance.id == null} ? @{/attendance} : @{/attendance/{id}(id=${attendance.id})}" method="post">
                    <div class="form-grid">
                        <div class="field">
                            <label>Batch ID <span class="required">*</span></label>
                            <input class="input" type="number" name="batchId" th:value="${attendance.batchId}" required>
                        </div>
                        <div class="field">
                            <label>Student ID <span class="required">*</span></label>
                            <input class="input" type="number" name="studentId" th:value="${attendance.studentId}" required>
                        </div>
                        <div class="field">
                            <label>Date <span class="required">*</span></label>
                            <input class="input" type="date" name="attendanceDate" th:value="${attendance.attendanceDate}" required>
                        </div>
                        <div class="field">
                            <label>Status <span class="required">*</span></label>
                            <select class="select" name="status" required>
                                <option value="">Select Status</option>
                                <option value="PRESENT" th:selected="${attendance.status != null and attendance.status.name() == 'PRESENT'}">PRESENT</option>
                                <option value="ABSENT" th:selected="${attendance.status != null and attendance.status.name() == 'ABSENT'}">ABSENT</option>
                                <option value="LATE" th:selected="${attendance.status != null and attendance.status.name() == 'LATE'}">LATE</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a class="btn secondary" th:href="@{/attendance}">Cancel</a>
                        <button type="submit" class="btn primary">Save Attendance</button>
                    </div>
                </form>
            </section>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

</body>
</html>
