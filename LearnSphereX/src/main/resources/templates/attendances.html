<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Attendance')}"></head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(active='attendance')}"></div>

    <div class="main-area">
        <div th:replace="~{fragments/navbar :: navbar(heading=${pageTitle} ?: 'Attendance Management', eyebrow='BATCH MANAGEMENT')}"></div>

        <main class="page-content">
            <div class="page-title">
                <div>
                    <h2 th:text="${pageTitle} ?: 'Attendance Management'">Attendance Management</h2>
                    <p>Track present, absent and late records across every session.</p>
                </div>
                <a class="btn primary" th:href="@{/attendance/new}">+ Mark Attendance</a>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <div>
                        <span class="eyebrow">DATABASE RECORDS</span>
                        <h3>All Records</h3>
                    </div>
                    <a class="icon-link" th:href="@{/attendance}">View all attendance</a>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Batch ID</th>
                                <th>Student ID</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="attendance : ${attendances}">
                                <td th:text="${attendance.id}">1</td>
                                <td th:text="${attendance.batchId}">1</td>
                                <td th:text="${attendance.studentId}">101</td>
                                <td th:text="${attendance.attendanceDate}">2026-08-20</td>
                                <td>
                                    <span class="pill"
                                          th:classappend="${attendance.status.name() == 'ABSENT'} ? ' inactive' : (${attendance.status.name() == 'LATE'} ? ' warning' : '')"
                                          th:text="${attendance.status}">PRESENT</span>
                                </td>
                                <td>
                                    <div class="actions">
                                        <a class="btn small secondary" th:href="@{/attendance/{id}(id=${attendance.id})}">View</a>
                                        <a class="btn small secondary" th:href="@{/attendance/{id}/edit(id=${attendance.id})}">Edit</a>
                                        <form th:action="@{/attendance/{id}/delete(id=${attendance.id})}" method="post"
                                              onsubmit="return confirm('Delete this attendance record? This cannot be undone.');" style="display:inline">
                                            <button class="btn small danger" type="submit">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(attendances)}">
                                <td colspan="6" class="empty">No attendance records found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

</body>
</html>
