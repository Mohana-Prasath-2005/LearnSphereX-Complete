<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f7f7f7;
        }

        h1 {
            text-align: center;
        }

        .actions {
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            margin-right: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #eeeeee;
        }

        .present {
            color: green;
            font-weight: bold;
        }

        .absent {
            color: red;
            font-weight: bold;
        }

        .late {
            color: orange;
            font-weight: bold;
        }

        .action-link {
            margin: 3px;
            text-decoration: none;
        }

        .delete-form {
            display: inline;
        }

        .delete-btn {
            border: none;
            background: none;
            color: red;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1 th:text="${pageTitle} ?: 'Attendance Management'">Attendance Management</h1>

    <div class="actions">

        <a href="/attendance/new" class="btn">
            Mark Attendance
        </a>

        <a href="/attendance" class="btn">
            View All Attendance
        </a>

    </div>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Batch ID</th>
                <th>Student ID</th>
                <th>Attendance Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="attendance : ${attendances}">

                <td th:text="${attendance.id}">
                    1
                </td>

                <td th:text="${attendance.batchId}">
                    1
                </td>

                <td th:text="${attendance.studentId}">
                    101
                </td>

                <td th:text="${attendance.attendanceDate}">
                    2026-08-20
                </td>

                <td
                    th:text="${attendance.status}"
                    th:classappend="
                        ${attendance.status.name() == 'PRESENT'}
                        ? 'present'
                        :
                        (${attendance.status.name() == 'ABSENT'}
                        ? 'absent'
                        : 'late')">

                    PRESENT

                </td>

                <td>

                    <a
                        th:href="@{/attendance/{id}(id=${attendance.id})}"
                        class="action-link">
                        View
                    </a>

                    |

                    <a
                        th:href="@{/attendance/{id}/edit(id=${attendance.id})}"
                        class="action-link">
                        Edit
                    </a>

                    |

                    <form
                        th:action="@{/attendance/{id}/delete(id=${attendance.id})}"
                        method="post"
                        class="delete-form">

                        <button
                            type="submit"
                            class="delete-btn"
                            onclick="return confirm('Are you sure you want to delete this attendance record?');">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(attendances)}">

                <td colspan="6">
                    No attendance records found.
                </td>

            </tr>

        </tbody>

    </table>

</body>

</html>
