<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${batch.id == null ? 'Create Batch' : 'Edit Batch'}">
        Create Batch
    </title>

    <link rel="stylesheet"
          th:href="@{/css/batch.css}">

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

</head>


<body>

<div class="app-shell">


    <!-- ================= SIDEBAR ================= -->

    <div th:replace="~{fragments/sidebar :: sidebar(active='batches')}"></div>



    <!-- ================= MAIN ================= -->

    <main class="main-area">


        <!-- HEADER -->

        <div th:replace="~{fragments/navbar :: navbar(heading=${batch.id == null} ? 'Create Batch' : 'Edit Batch', eyebrow='BATCH MANAGEMENT')}"></div>



        <!-- ================= CONTENT ================= -->

        <section class="content-area">


            <!-- PAGE HEADING -->

            <div class="page-heading">

                <div>

                    <h2 th:text="${batch.id == null ? 'Create New Batch' : 'Edit Batch'}">
                        Create New Batch
                    </h2>

                    <p>
                        Create and manage training batch information.
                    </p>

                </div>

            </div>



            <!-- ================= FORM ================= -->

            <div class="form-card">


                <form th:object="${batch}"
                      th:action="${batch.id == null}
                          ? @{/batches}
                          : @{/batches/{id}(id=${batch.id})}"
                      method="post">


                    <!-- BATCH NAME -->

                    <div class="form-group">

                        <label for="batchName">
                            Batch Name
                        </label>

                        <input type="text"
                               id="batchName"
                               th:field="*{batchName}"
                               class="form-control"
                               placeholder="Enter batch name"
                               required>

                    </div>



                    <!-- BATCH MODE -->

                    <div class="form-group">

                        <label for="batchMode">
                            Batch Mode
                        </label>

                        <select id="batchMode"
                                th:field="*{batchMode}"
                                class="form-control"
                                required>

                            <option value="">
                                Select Mode
                            </option>

                            <option value="ONLINE">
                                ONLINE
                            </option>

                            <option value="OFFLINE">
                                OFFLINE
                            </option>

                            <option value="HYBRID">
                                HYBRID
                            </option>

                        </select>

                    </div>



                    <!-- BATCH STATUS -->

                    <div class="form-group">

                        <label for="batchStatus">
                            Batch Status
                        </label>

                        <select id="batchStatus"
                                th:field="*{batchStatus}"
                                class="form-control"
                                required>

                            <option value="">
                                Select Status
                            </option>

                            <option value="ACTIVE">
                                ACTIVE
                            </option>

                            <option value="INACTIVE">
                                INACTIVE
                            </option>

                            <option value="COMPLETED">
                                COMPLETED
                            </option>

                            <option value="CANCELLED">
                                CANCELLED
                            </option>

                        </select>

                    </div>



                    <!-- CAPACITY -->

                    <div class="form-group">

                        <label for="capacity">
                            Capacity
                        </label>

                        <input type="number"
                               id="capacity"
                               th:field="*{capacity}"
                               class="form-control"
                               placeholder="Enter capacity"
                               min="1"
                               required>

                    </div>



                    <!-- START DATE -->

                    <div class="form-group">

                        <label for="startDate">
                            Start Date
                        </label>

                        <input type="date"
                               id="startDate"
                               th:field="*{startDate}"
                               class="form-control"
                               required>

                    </div>



                    <!-- END DATE -->

                    <div class="form-group">

                        <label for="endDate">
                            End Date
                        </label>

                        <input type="date"
                               id="endDate"
                               th:field="*{endDate}"
                               class="form-control"
                               required>

                    </div>



                    <!-- TRAINER ID -->

                    <div class="form-group">

                        <label for="trainerId">
                            Trainer ID
                        </label>

                        <input type="number"
                               id="trainerId"
                               th:field="*{trainerId}"
                               class="form-control"
                               placeholder="Enter trainer ID">

                    </div>



                    <!-- COURSE ID -->

                    <div class="form-group">

                        <label for="courseId">
                            Course ID
                        </label>

                        <input type="number"
                               id="courseId"
                               th:field="*{courseId}"
                               class="form-control"
                               placeholder="Enter course ID">

                    </div>



                    <!-- BUTTONS -->

                    <div style="
                        display:flex;
                        gap:10px;
                        margin-top:28px;
                    ">

                        <button type="submit"
                                class="btn btn-primary">

                            <span th:text="${batch.id == null
                                ? 'Save Batch'
                                : 'Update Batch'}">
                                Save Batch
                            </span>

                        </button>


                        <a href="/batches"
                           class="btn"
                           style="
                               background-color:#667085;
                               color:white;
                           ">

                            Cancel

                        </a>

                    </div>


                </form>

            </div>

        </section>



        <!-- FOOTER -->

        <footer class="footer">

            <span>
                LearnSphereX Batch Management Module
            </span>

            <span>
                Spring Boot · JPA · Thymeleaf
            </span>

        </footer>


    </main>

</div>

</body>

</html>
