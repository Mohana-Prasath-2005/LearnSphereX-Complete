<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Schedule Details</title>

    <link rel="stylesheet"
          th:href="@{/css/batch.css}">

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

</head>


<body>

<div class="app-shell">


    <!-- =========================
         SIDEBAR
    ========================== -->

    <div th:replace="~{fragments/sidebar :: sidebar(active='batches')}"></div>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-area">


        <!-- HEADER -->

        <div th:replace="~{fragments/navbar :: navbar(heading='Schedule Details', eyebrow='BATCH MANAGEMENT')}"></div>



        <!-- =========================
             CONTENT
        ========================== -->

        <section class="content-area">


            <!-- PAGE HEADING -->

            <div class="page-heading">

                <div>

                    <h2>
                        Schedule Details
                    </h2>

                    <p>
                        View the complete information for this batch schedule.
                    </p>

                </div>


                <a
                    th:href="@{/batch-schedules/batch/{id}(id=${schedule.batchId})}"
                    class="back-link">

                    ← Back to Schedules

                </a>

            </div>



            <!-- =========================
                 DETAILS CARD
            ========================== -->

            <div class="details-card">


                <!-- SCHEDULE ID -->

                <div class="detail-row">

                    <span class="detail-label">
                        Schedule ID
                    </span>

                    <span class="detail-value"
                          th:text="${schedule.id}">
                        1
                    </span>

                </div>



                <!-- BATCH ID -->

                <div class="detail-row">

                    <span class="detail-label">
                        Batch ID
                    </span>

                    <span class="detail-value"
                          th:text="${schedule.batchId}">
                        9
                    </span>

                </div>



                <!-- DAY -->

                <div class="detail-row">

                    <span class="detail-label">
                        Day of Week
                    </span>

                    <span class="detail-value"
                          th:text="${schedule.dayOfWeek}">
                        MONDAY
                    </span>

                </div>



                <!-- START TIME -->

                <div class="detail-row">

                    <span class="detail-label">
                        Start Time
                    </span>

                    <span class="detail-value"
                          th:text="${schedule.startTime}">
                        09:00
                    </span>

                </div>



                <!-- END TIME -->

                <div class="detail-row">

                    <span class="detail-label">
                        End Time
                    </span>

                    <span class="detail-value"
                          th:text="${schedule.endTime}">
                        10:00
                    </span>

                </div>


            </div>



            <!-- =========================
                 ACTIONS
            ========================== -->

            <div class="form-actions"
                 style="border-top:none; padding-top:0; margin-top:24px;">


                <!-- EDIT -->

                <a
                    th:href="@{/batch-schedules/{id}/edit(id=${schedule.id})}"
                    class="btn btn-edit">

                    Edit Schedule

                </a>



                <!-- DELETE -->

                <form
                    th:action="@{/batch-schedules/{id}/delete(id=${schedule.id})}"
                    method="post"
                    class="delete-form">

                    <button
                        type="submit"
                        class="btn btn-delete"
                        onclick="return confirm('Are you sure you want to delete this schedule?');">

                        Delete Schedule

                    </button>

                </form>



                <!-- BACK -->

                <a
                    th:href="@{/batch-schedules/batch/{id}(id=${schedule.batchId})}"
                    class="btn btn-secondary">

                    Back

                </a>

            </div>


        </section>



        <!-- FOOTER -->

        <footer class="footer">

            <span>
                LearnSphereX Batch Management Module
            </span>

            <span>
                Spring Boot · JPA · Thymeleaf
            </span>

        </footer>


    </main>

</div>

</body>

</html>
