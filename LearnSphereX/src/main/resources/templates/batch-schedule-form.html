<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Batch Schedule</title>

    <link rel="stylesheet"
          th:href="@{/css/batch.css}">

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

</head>


<body>

<div class="app-shell">


    <!-- =========================
         SIDEBAR
    ========================== -->

    <div th:replace="~{fragments/sidebar :: sidebar(active='batches')}"></div>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-area">


        <!-- HEADER -->

        <div th:replace="~{fragments/navbar :: navbar(heading=${schedule.id == null} ? 'Create Schedule' : 'Edit Schedule', eyebrow='BATCH MANAGEMENT')}"></div>



        <!-- =========================
             PAGE CONTENT
        ========================== -->

        <section class="content-area">


            <!-- PAGE TITLE -->

            <div class="page-heading">

                <div>

                    <h2
                        th:if="${schedule.id == null}">
                        Create Batch Schedule
                    </h2>


                    <h2
                        th:if="${schedule.id != null}">
                        Edit Batch Schedule
                    </h2>


                    <p>
                        Create and manage the weekly schedule for this batch.
                    </p>

                </div>


                <a
                    th:href="@{/batch-schedules/batch/{id}(id=${batchId})}"
                    class="back-link">

                    ← Back to Schedules

                </a>

            </div>



            <!-- =========================
                 FORM CARD
            ========================== -->

            <div class="form-card">


                <form
                    th:action="${schedule.id == null}
                        ? @{/batch-schedules}
                        : @{/batch-schedules/{id}(id=${schedule.id})}"
                    th:object="${schedule}"
                    method="post">


                    <!-- BATCH ID -->

                    <div class="form-group">

                        <label for="batchId">
                            Batch ID
                        </label>

                        <input
                            id="batchId"
                            type="number"
                            th:field="*{batchId}"
                            placeholder="Enter batch ID"
                            required>

                    </div>



                    <!-- DAY OF WEEK -->

                    <div class="form-group">

                        <label for="dayOfWeek">
                            Day of Week
                        </label>

                        <select
                            id="dayOfWeek"
                            th:field="*{dayOfWeek}"
                            required>

                            <option value="">
                                Select Day
                            </option>

                            <option value="MONDAY">
                                Monday
                            </option>

                            <option value="TUESDAY">
                                Tuesday
                            </option>

                            <option value="WEDNESDAY">
                                Wednesday
                            </option>

                            <option value="THURSDAY">
                                Thursday
                            </option>

                            <option value="FRIDAY">
                                Friday
                            </option>

                            <option value="SATURDAY">
                                Saturday
                            </option>

                            <option value="SUNDAY">
                                Sunday
                            </option>

                        </select>

                    </div>



                    <!-- TIME ROW -->

                    <div class="time-row">


                        <!-- START TIME -->

                        <div class="form-group">

                            <label for="startTime">
                                Start Time
                            </label>

                            <input
                                id="startTime"
                                type="time"
                                th:field="*{startTime}"
                                required>

                        </div>



                        <!-- END TIME -->

                        <div class="form-group">

                            <label for="endTime">
                                End Time
                            </label>

                            <input
                                id="endTime"
                                type="time"
                                th:field="*{endTime}"
                                required>

                        </div>

                    </div>



                    <!-- BUTTONS -->

                    <div class="form-actions">


                        <button
                            type="submit"
                            class="btn btn-primary">

                            <span>✓</span>

                            <span
                                th:if="${schedule.id == null}">
                                Save Schedule
                            </span>

                            <span
                                th:if="${schedule.id != null}">
                                Update Schedule
                            </span>

                        </button>


                        <a
                            th:href="@{/batch-schedules/batch/{id}(id=${batchId})}"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </div>


                </form>

            </div>

        </section>



        <!-- =========================
             FOOTER
        ========================== -->

        <footer class="footer">

            <span>
                LearnSphereX Batch Management Module
            </span>

            <span>
                Spring Boot · JPA · Thymeleaf
            </span>

        </footer>


    </main>

</div>

</body>

</html>
