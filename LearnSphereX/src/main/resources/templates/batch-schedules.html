<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Batch Schedules</title>

    <link rel="stylesheet"
          th:href="@{/css/batch.css}">

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

</head>


<body>

<div class="app-shell">


    <!-- =========================
         SIDEBAR
    ========================== -->

    <div th:replace="~{fragments/sidebar :: sidebar(active='batches')}"></div>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-area">


        <!-- HEADER -->

        <div th:replace="~{fragments/navbar :: navbar(heading='Batch Schedules', eyebrow='BATCH MANAGEMENT')}"></div>



        <!-- =========================
             CONTENT
        ========================== -->

        <section class="content-area">


            <!-- PAGE HEADING -->

            <div class="page-heading">

                <div>

                    <h2>
                        Batch Schedules
                    </h2>

                    <p>

                        Manage schedules for Batch

                        <strong th:text="${batchId}">
                            1
                        </strong>

                    </p>

                </div>


                <!-- IMPORTANT:
                     Pass batchId to create page
                -->

                <a
                    th:href="@{/batch-schedules/new(batchId=${batchId})}"
                    class="btn btn-primary">

                    + Create New Schedule

                </a>

            </div>



            <!-- =========================
                 TABLE CARD
            ========================== -->

            <div class="table-card">


                <table class="batch-table">


                    <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Batch ID
                        </th>

                        <th>
                            Day
                        </th>

                        <th>
                            Start Time
                        </th>

                        <th>
                            End Time
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                    </thead>



                    <tbody>


                    <!-- =========================
                         SCHEDULE ROW
                    ========================== -->

                    <tr
                        th:each="schedule : ${schedules}">


                        <!-- ID -->

                        <td
                            th:text="${schedule.id}">

                            1

                        </td>



                        <!-- BATCH ID -->

                        <td
                            th:text="${schedule.batchId}">

                            1

                        </td>



                        <!-- DAY OF WEEK -->

                        <td
                            th:text="${schedule.dayOfWeek}">

                            MONDAY

                        </td>



                        <!-- START TIME -->

                        <td
                            th:text="${schedule.startTime}">

                            09:00

                        </td>



                        <!-- END TIME -->

                        <td
                            th:text="${schedule.endTime}">

                            10:00

                        </td>



                        <!-- ACTIONS -->

                        <td>

                            <div class="schedule-actions">


                                <!-- VIEW -->

                                <a
                                    th:href="@{/batch-schedules/{id}(id=${schedule.id})}"
                                    class="btn btn-view">

                                    View

                                </a>



                                <!-- EDIT -->

                                <a
                                    th:href="@{/batch-schedules/{id}/edit(id=${schedule.id})}"
                                    class="btn btn-edit">

                                    Edit

                                </a>



                                <!-- DELETE -->

                                <form
                                    th:action="@{/batch-schedules/{id}/delete(id=${schedule.id})}"
                                    method="post"
                                    class="delete-form">


                                    <button
                                        type="submit"
                                        class="btn btn-delete"
                                        onclick="return confirm('Are you sure you want to delete this schedule?');">

                                        Delete

                                    </button>


                                </form>


                            </div>

                        </td>


                    </tr>



                    <!-- =========================
                         EMPTY MESSAGE
                    ========================== -->

                    <tr
                        th:if="${#lists.isEmpty(schedules)}">

                        <td
                            colspan="6"
                            class="empty-message">

                            No schedules found for this batch.

                        </td>

                    </tr>


                    </tbody>

                </table>


            </div>



            <!-- =========================
                 BACK BUTTON
            ========================== -->

            <div class="back-section">

                <a
                    th:href="@{/batches/{id}(id=${batchId})}"
                    class="btn btn-secondary">

                    ← Back to Batch

                </a>

            </div>


        </section>



        <!-- =========================
             FOOTER
        ========================== -->

        <footer class="footer">

            <span>
                LearnSphereX Batch Management Module
            </span>

            <span>
                Spring Boot · JPA · Thymeleaf
            </span>

        </footer>


    </main>

</div>

</body>

</html>
