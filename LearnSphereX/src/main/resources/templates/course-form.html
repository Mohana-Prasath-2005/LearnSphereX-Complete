<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LearnSphereX - Course Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">SS</div>
            <div>
                <strong>LearnSphereX</strong>
                <span>Enterprise Portal</span>
            </div>
        </div>
        <div class="nav-label">NAVIGATION</div>
        <nav class="nav">
            <a class="nav-item" th:href="@{/courses}">📚 Courses</a>
            <a class="nav-item" th:href="@{/assignments}">📝 Assignments</a>
        </nav>
        <div class="sidebar-footer">
            <div class="mini-avatar">AD</div>
            <div>
                <strong>Admin User</strong>
                <span>admin@learnspherex.com</span>
            </div>
        </div>
    </aside>

    <div class="main-area">
        <header class="topbar">
            <div>
                <span class="eyebrow">MODULE MANAGEMENT</span>
                <h1 th:text="${editing} ? 'Edit Course' : 'Add New Course'">Add New Course</h1>
            </div>
            <div class="topbar-right">
                <span class="status-dot"></span> System Online
            </div>
        </header>

        <main class="page-content">
            <div class="panel form-panel">
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

                <form th:action="${editing} ? @{/courses/{id}/edit(id=${courseId})} : @{/courses}" method="post">
                    <div class="form-group">
                        <label>Course Code</label>
                        <input type="text" name="courseCode" th:value="${courseCode}" placeholder="e.g. JAVA-FS-01" required>
                    </div>
                    <div class="form-group">
                        <label>Course Name</label>
                        <input type="text" name="courseName" th:value="${courseName}" placeholder="e.g. Java Full Stack" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" th:text="${description}" placeholder="Short description of the course"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Duration</label>
                        <input type="text" name="duration" th:value="${duration}" placeholder="e.g. 120 days">
                    </div>
                    <div class="form-group">
                        <label>Fee (₹)</label>
                        <input type="number" step="0.01" min="0" name="fee" th:value="${fee}" required>
                    </div>
                    <div class="form-group">
                        <label>Prerequisites</label>
                        <textarea name="prerequisites" th:text="${prerequisites}" placeholder="e.g. Basic programming knowledge"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Learning Objectives</label>
                        <textarea name="learningObjectives" th:text="${learningObjectives}" placeholder="What will students learn"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="status">
                            <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">ACTIVE</option>
                            <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">INACTIVE</option>
                            <option value="ARCHIVED" th:selected="${status == 'ARCHIVED'}">ARCHIVED</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" th:text="${editing} ? 'Save Changes' : 'Create Course'">Create Course</button>
                        <a class="btn btn-secondary" th:href="@{/courses}">Cancel</a>
                    </div>
                </form>
            </div>
        </main>

        <footer class="footer">
            <span>&copy; 2026 LearnSphereX Enterprise. All rights reserved.</span>
        </footer>
    </div>
</div>

</body>
</html>
