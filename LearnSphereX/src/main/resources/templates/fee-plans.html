<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Fee Plans')}"></head><body><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar(active='fee-plans')}"></div><section class="main-area"><div th:replace="~{fragments/navbar :: navbar(heading='Fee Plans', eyebrow='PAYMENT SETUP')}"></div><div class="page-content"><div class="alert success" th:if="${param.success}">Fee plan created successfully.</div><section class="form-panel"><div class="eyebrow">PAYMENT SETUP</div><h2>Create fee plan</h2><p style="color:var(--muted)">Enter the Course ID supplied by the Course module. You do not create the course here.</p><form th:action="@{/fee-plans}" method="post"><div class="form-grid"><div class="field"><label>Course ID *</label><input class="input" name="courseId" type="number" min="1" required></div><div class="field"><label>Fee plan name *</label><input class="input" name="name" required></div><div class="field full"><label>Total amount *</label><input class="input" name="totalAmount" type="number" min="1" required></div><div class="field"><label>First installment amount *</label><input class="input" name="amount1" type="number" min="1" required></div><div class="field"><label>First due date *</label><input class="input" name="due1" type="date" required></div><div class="field"><label>Second installment amount *</label><input class="input" name="amount2" type="number" min="1" required></div><div class="field"><label>Second due date *</label><input class="input" name="due2" type="date" required></div></div><div class="form-actions"><button class="btn primary">Create fee plan</button></div></form></section></div><div th:replace="~{fragments/footer :: footer}"></div></section></div></body></html>
