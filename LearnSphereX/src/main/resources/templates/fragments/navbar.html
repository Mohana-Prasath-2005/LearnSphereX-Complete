<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="navbar(heading, eyebrow)" class="topbar">
    <div>
        <div class="eyebrow" th:text="${eyebrow != null ? eyebrow : 'LEARNSPHEREX'}">LEARNSPHEREX</div>
        <h1 th:text="${heading != null ? heading : (pageHeading != null ? pageHeading : 'Dashboard')}">Dashboard</h1>
    </div>
    <div class="user-area">
        <span class="online-dot"></span>
        <span sec:authentication="name">user</span>
    </div>
</header>
</body>
</html>
