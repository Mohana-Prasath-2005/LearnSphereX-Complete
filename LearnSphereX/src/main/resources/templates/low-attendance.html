<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Low Attendance')}"></head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(active='attendance')}"></div>

    <div class="main-area">
        <div th:replace="~{fragments/navbar :: navbar(heading='Low Attendance', eyebrow='BATCH MANAGEMENT')}"></div>

        <main class="page-content">
            <a class="back-link" th:href="@{/attendance/batch/{batchId}(batchId=${batchId})}">← Back to Batch Attendance</a>

            <div class="page-title">
                <div>
                    <h2 th:text="'Students Below 75% Attendance — Batch ' + ${batchId}">Low Attendance</h2>
                    <p>Students who need a low-attendance follow-up for this batch.</p>
                </div>
            </div>

            <div class="panel">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Attendance %</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="entry : ${lowAttendance}">
                                <td th:text="${entry.key}"></td>
                                <td><span class="pill inactive" th:text="${#numbers.formatDecimal(entry.value, 1, 2)} + '%'"></span></td>
                            </tr>
                            <tr th:if="${#maps.isEmpty(lowAttendance)}">
                                <td colspan="2" class="empty">No students below 75% attendance in this batch.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

</body>
</html>
