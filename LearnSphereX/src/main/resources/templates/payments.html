<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments | LearnSphereX</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">S</div><div><strong>LearnSphereX</strong><span>LEARNING MANAGEMENT SYSTEM</span></div></div><nav class="nav"><a class="nav-item" th:href="@{/dashboard}">Dashboard</a><div class="nav-label">SORN MODULE</div><a class="nav-item" th:href="@{/users}">Users</a><a class="nav-item" th:href="@{/fee-plans}">Fee Plans</a><a class="nav-item active" th:href="@{/payments}">Record Payment</a></nav></aside><section class="main-area"><header class="topbar"><div><div class="eyebrow">LEARNSPHEREX / PAYMENT MANAGEMENT</div><h1>Record Payment</h1></div></header><div class="page-content"><div class="alert success" th:if="${param.receipt}">Payment saved. Receipt number: <strong th:text="${param.receipt}"></strong></div><section class="form-panel"><h2>Record payment</h2><p style="color:var(--muted)">Use the Student User ID and Installment ID from the shared system.</p><form th:action="@{/payments}" method="post"><div class="form-grid"><div class="field"><label>Student User ID *</label><input class="input" name="studentUserId" type="number" min="1" required></div><div class="field"><label>Installment ID *</label><input class="input" name="installmentId" type="number" min="1" required></div><div class="field"><label>Amount *</label><input class="input" name="amount" type="number" min="1" required></div><div class="field"><label>Payment method *</label><select class="select" name="method"><option th:each="method : ${methods}" th:value="${method}" th:text="${method}"></option></select></div><div class="field full"><label>Transaction reference *</label><input class="input" name="transactionReference" required></div></div><div class="form-actions"><button class="btn primary">Save payment & generate receipt</button></div></form></section></div></section></div></body></html>
