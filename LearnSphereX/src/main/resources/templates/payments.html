<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head('Record Payment')}"></head><body><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar(active='payments')}"></div><section class="main-area"><div th:replace="~{fragments/navbar :: navbar(heading='Record Payment', eyebrow='PAYMENT MANAGEMENT')}"></div><div class="page-content"><div class="alert success" th:if="${param.receipt}">Payment saved. Receipt number: <strong th:text="${param.receipt}"></strong></div><section class="form-panel"><h2>Record payment</h2><p style="color:var(--muted)">Use the Student User ID and Installment ID from the shared system.</p><form th:action="@{/payments}" method="post"><div class="form-grid"><div class="field"><label>Student User ID *</label><input class="input" name="studentUserId" type="number" min="1" required></div><div class="field"><label>Installment ID *</label><input class="input" name="installmentId" type="number" min="1" required></div><div class="field"><label>Amount *</label><input class="input" name="amount" type="number" min="1" required></div><div class="field"><label>Payment method *</label><select class="select" name="method"><option th:each="method : ${methods}" th:value="${method}" th:text="${method}"></option></select></div><div class="field full"><label>Transaction reference *</label><input class="input" name="transactionReference" required></div></div><div class="form-actions"><button class="btn primary">Save payment & generate receipt</button></div></form></section></div><div th:replace="~{fragments/footer :: footer}"></div></section></div></body></html>
