<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Evaluation Criteria')}"></head>
<body><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar(active='projects')}"></div><main class="main-area">
<div th:replace="~{fragments/navbar :: navbar(heading='Evaluation Criteria', eyebrow='COURSEWORK')}"></div><section class="page-content"><div th:replace="~{fragments/messages :: messages}"></div><a class="back-link" th:href="@{/projects/{id}(id=${project.id})}">← Back to Project</a><div class="page-title"><div><h2>Evaluation Criteria</h2><p th:text="${project.title}">Project</p></div></div>
<div class="two-column-wide"><form class="form-panel" th:action="@{/projects/{id}/criteria/save(id=${project.id})}" th:object="${criteriaForm}" method="post"><h3>Add Criteria</h3><div class="field"><label>Criteria Name</label><input class="input" th:field="*{criteriaName}" placeholder="Architecture" required></div><div class="field section-space"><label>Maximum Marks</label><input class="input" type="number" min="1" th:field="*{maximumMarks}" required></div><div class="field section-space"><label>Description</label><textarea class="textarea" th:field="*{description}"></textarea></div><div class="form-actions"><button class="btn primary" type="submit">Add Criteria</button></div></form>
<div class="panel"><div class="panel-head"><div><span class="eyebrow">SCORING</span><h3>Current Criteria</h3></div></div><div class="table-wrap"><table><thead><tr><th>Criteria</th><th>Marks</th><th>Description</th><th></th></tr></thead><tbody><tr th:each="c : ${criteria}"><td><strong th:text="${c.criteriaName}">Architecture</strong></td><td th:text="${c.maximumMarks}">20</td><td th:text="${c.description}">Description</td><td><form th:action="@{/criteria/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Delete this criterion?');"><input type="hidden" name="projectId" th:value="${project.id}"><button class="btn small danger" type="submit">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(criteria)}"><td colspan="4" class="empty">No criteria defined.</td></tr></tbody></table></div><div class="criteria-total">Total: <span th:text="${criteriaTotal}">0</span> / <span th:text="${project.maximumMarks}">100</span></div></div></div>
</section><div th:replace="~{fragments/footer :: footer}"></div></main></div></body></html>
