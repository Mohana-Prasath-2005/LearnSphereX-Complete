<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | LearnSphereX</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><main class="login-shell"><section class="login-card"><div class="brand"><div class="brand-mark">S</div><div><strong style="color:#172033">LearnSphereX</strong><span>STUDENT REGISTRATION</span></div></div><h1>Create account</h1><p>Register as a LearnSphereX student.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form th:action="@{/register}" method="post"><div class="form-grid"><div class="field"><label>First name *</label><input class="input" name="firstName" required></div><div class="field"><label>Last name *</label><input class="input" name="lastName" required></div><div class="field"><label>Username *</label><input class="input" name="username" required></div><div class="field"><label>Phone</label><input class="input" name="phone"></div><div class="field full"><label>Email *</label><input class="input" name="email" type="email" required></div><div class="field full"><label>Password *</label><input class="input" name="password" type="password" minlength="8" required></div></div><button class="btn primary" style="width:100%;margin-top:18px">Create student account</button></form><p style="margin-top:18px;text-align:center"><a th:href="@{/login}">Back to sign in</a></p></section></main></body></html>
