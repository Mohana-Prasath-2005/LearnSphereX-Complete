<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Batch Report')}"></head>
<body><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-area"><div th:replace="~{fragments/navbar :: navbar}"></div><section class="page-content"><a class="back-link" th:href="@{/reports}">← Back to Reports</a><div class="page-title"><div><h2 th:text="${report.batchCode}">Batch</h2><p>Batch performance summary.</p></div></div><div class="summary-grid"><div class="summary"><span>Total Students</span><strong th:text="${report.totalStudents}">45</strong></div><div class="summary"><span>Active Students</span><strong th:text="${report.activeStudents}">40</strong></div><div class="summary"><span>Submissions</span><strong th:text="${report.projectSubmissions}">22</strong></div><div class="summary"><span>Evaluated</span><strong th:text="${report.evaluatedSubmissions}">18</strong></div></div><div class="detail-card"><h3>Average Project Performance</h3><div class="metric-highlight" th:text="${report.averageProjectPercentage != null ? report.averageProjectPercentage + '%' : 'N/A'}">84%</div></div></section><div th:replace="~{fragments/footer :: footer}"></div></main></div></body></html>
