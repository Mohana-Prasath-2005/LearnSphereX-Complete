<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Project Report')}"></head>
<body><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-area"><div th:replace="~{fragments/navbar :: navbar}"></div><section class="page-content"><a class="back-link" th:href="@{/reports}">← Back to Reports</a><div class="page-title"><div><h2 th:text="${report.title}">Project</h2><p>Project performance summary.</p></div></div><div class="summary-grid"><div class="summary"><span>Total Submissions</span><strong th:text="${report.totalSubmissions}">22</strong></div><div class="summary"><span>Evaluated</span><strong th:text="${report.evaluatedSubmissions}">18</strong></div><div class="summary"><span>Pending</span><strong th:text="${report.pendingEvaluations}">4</strong></div><div class="summary"><span>Maximum Marks</span><strong th:text="${report.maximumMarks}">100</strong></div></div><div class="detail-card"><h3>Score Analysis</h3><div class="detail-grid"><div class="detail-item"><span>Average Marks</span><strong th:text="${report.averageMarks != null ? report.averageMarks : 'N/A'}">84</strong></div><div class="detail-item"><span>Average Percentage</span><strong th:text="${report.averagePercentage != null ? report.averagePercentage + '%' : 'N/A'}">84%</strong></div><div class="detail-item"><span>Highest Marks</span><strong th:text="${report.highestMarks != null ? report.highestMarks : 'N/A'}">96</strong></div><div class="detail-item"><span>Lowest Marks</span><strong th:text="${report.lowestMarks != null ? report.lowestMarks : 'N/A'}">61</strong></div></div></div></section><div th:replace="~{fragments/footer :: footer}"></div></main></div></body></html>
