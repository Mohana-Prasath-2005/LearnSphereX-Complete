<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Student Report')}"></head>
<body><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-area"><div th:replace="~{fragments/navbar :: navbar}"></div><section class="page-content"><a class="back-link" th:href="@{/reports}">← Back to Reports</a><div class="hero"><div><span class="badge">STUDENT REPORT</span><h2 th:text="${student.studentCode}">STU</h2><p th:text="${student.college}">College</p></div></div><div class="summary-grid"><div class="summary"><span>Total Courses</span><strong th:text="${report.totalCourses}">2</strong></div><div class="summary"><span>Active Courses</span><strong th:text="${report.activeCourses}">1</strong></div><div class="summary"><span>Project Submissions</span><strong th:text="${report.totalProjects}">2</strong></div><div class="summary"><span>Evaluated Projects</span><strong th:text="${report.evaluatedProjects}">1</strong></div></div><div class="detail-card"><h3>Performance</h3><div class="detail-grid"><div class="detail-item"><span>Project Average</span><strong th:text="${report.projectAveragePercentage != null ? report.projectAveragePercentage + '%' : 'N/A'}">84%</strong></div><div class="detail-item"><span>Overall Performance</span><strong th:text="${report.overallPerformancePercentage != null ? report.overallPerformancePercentage + '%' : 'N/A'}">84%</strong></div></div></div></section><div th:replace="~{fragments/footer :: footer}"></div></main></div></body></html>
