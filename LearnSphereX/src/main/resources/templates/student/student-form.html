<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${pageTitle})}"></head>
<body><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-area">
<div th:replace="~{fragments/navbar :: navbar}"></div><section class="page-content">
<a class="back-link" th:href="@{/students}">← Back to Students</a><div class="page-title"><div><h2 th:text="${pageTitle}">Add Student</h2><p>Enter the learner's profile information.</p></div></div>
<form class="form-panel" th:action="@{/students/save}" th:object="${studentForm}" method="post">
<input type="hidden" th:field="*{id}"><div class="form-grid">
<div class="field"><label>User ID <span class="required">*</span></label><input class="input" type="number" th:field="*{userId}" required></div>
<div class="field"><label>Student Code <span class="required">*</span></label><input class="input" th:field="*{studentCode}" placeholder="STU2026003" required></div>
<div class="field"><label>Date of Birth</label><input class="input" type="date" th:field="*{dateOfBirth}"></div>
<div class="field"><label>Gender</label><select class="select" th:field="*{gender}"><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option></select></div>
<div class="field"><label>Qualification <span class="required">*</span></label><input class="input" th:field="*{qualification}" placeholder="B.E CSE" required></div>
<div class="field"><label>College <span class="required">*</span></label><input class="input" th:field="*{college}" placeholder="ABC Engineering College" required></div>
<div class="field full"><label>Address</label><textarea class="textarea" th:field="*{address}" placeholder="Student address"></textarea></div>
<div class="field"><label>Joining Date <span class="required">*</span></label><input class="input" type="date" th:field="*{joiningDate}" required></div>
<div class="field"><label>Status</label><select class="select" th:field="*{status}"><option th:each="s : ${T(com.example.jobi.student.entity.StudentStatus).values()}" th:value="${s}" th:text="${s}"></option></select></div>
</div><div class="form-actions"><a class="btn secondary" th:href="@{/students}">Cancel</a><button class="btn primary" type="submit">Save Student</button></div></form>
</section><div th:replace="~{fragments/footer :: footer}"></div></main></div></body></html>
