<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Submissions')}"></head>
<body><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar(active='submissions')}"></div><main class="main-area">
<div th:replace="~{fragments/navbar :: navbar(heading='Submissions', eyebrow='COURSEWORK')}"></div><section class="page-content"><div th:replace="~{fragments/messages :: messages}"></div><div class="page-title"><div><h2>Project Submissions</h2><p th:if="${project != null}" th:text="${'Submissions for ' + project.title}">Project</p><p th:if="${student != null}" th:text="${'Submissions by ' + student.studentCode}">Student</p><p th:if="${project == null and student == null}">Review student deliverables and evaluation status.</p></div></div>
<div class="panel"><div class="table-wrap"><table><thead><tr><th>Student</th><th>Project</th><th>Version</th><th>Submitted At</th><th>Status</th><th>Links</th><th>Action</th></tr></thead><tbody><tr th:each="s : ${submissions}"><td th:text="${s.studentCode}">STU</td><td th:text="${s.projectTitle}">Project</td><td th:text="${s.version}">1.0</td><td th:text="${s.submittedAt}">date</td><td><span class="pill" th:text="${s.status}">SUBMITTED</span></td><td><div class="links"><a class="code-link" th:if="${s.githubUrl != null and !#strings.isEmpty(s.githubUrl)}" th:href="${s.githubUrl}" target="_blank">GitHub</a><a class="code-link" th:if="${s.deploymentUrl != null and !#strings.isEmpty(s.deploymentUrl)}" th:href="${s.deploymentUrl}" target="_blank">Live</a></div></td><td><div class="actions"><a class="btn small secondary" th:href="@{/submissions/{id}(id=${s.id})}">View</a><a class="btn small primary" th:if="${s.status.name() != 'EVALUATED'}" th:href="@{/submissions/{id}/evaluate(id=${s.id})}">Evaluate</a></div></td></tr><tr th:if="${#lists.isEmpty(submissions)}"><td colspan="7" class="empty">No submissions found.</td></tr></tbody></table></div></div>
</section><div th:replace="~{fragments/footer :: footer}"></div></main></div></body></html>
