<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Users')}"></head>
<body>
	<div class="app-shell">
		<div th:replace="~{fragments/sidebar :: sidebar(active='users')}"></div>
		<section class="main-area">
			<div th:replace="~{fragments/navbar :: navbar(heading='Users', eyebrow='ADMINISTRATION')}"></div>
			<div class="page-content">
				<div class="panel">
					<div class="panel-head">
						<div>
							<div class="eyebrow">AUTHENTICATION</div>
							<h3>Registered users</h3>
						</div>
						<a class="btn primary" th:href="@{/users/new}">Create user</a>
					</div>
					<div class="alert success" th:if="${param.created}" style="margin: 16px">User account created successfully.</div>
					<div class="table-wrap">
						<table>
							<thead>
								<tr>
									<th>ID</th>
									<th>User</th>
									<th>Email</th>
									<th>Role</th>
									<th>Status</th>
									<th>Action</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="user : ${users}">
									<td th:text="${user.id}"></td>
									<td><strong
										th:text="${user.firstName + ' ' + user.lastName}"></strong><small
										th:text="${user.username}"></small></td>
									<td th:text="${user.email}"></td>
									<td th:text="${user.roles}"></td>
									<td><span class="pill"
										th:classappend="${user.status.name() == 'ACTIVE'} ? '' : ' inactive'"
										th:text="${user.status}"></span></td>
									<td><form th:action="@{/users/{id}/status(id=${user.id})}"
											method="post">
											<input type="hidden" name="active"
												th:value="${user.status.name() != 'ACTIVE'}">
											<button class="btn small"
												th:classappend="${user.status.name() == 'ACTIVE'} ? ' danger' : ' primary'"
												th:text="${user.status.name() == 'ACTIVE'} ? 'Deactivate' : 'Activate'"></button>
										</form></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
			<div th:replace="~{fragments/footer :: footer}"></div>
		</section>
	</div>
</body>
</html>
